  <rect x="0" y="0" width="880" height="1" fill="#f5f1ea" fill-opacity="0.12"/>
  <rect x="0" y="119" width="880" height="1" fill="#f5f1ea" fill-opacity="0.12"/>

  <text x="48" y="52" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#f5f1ea" fill-opacity="0.4">03</text>

  <text x="110" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#f5f1ea" letter-spacing="-0.5">RLM<tspan font-style="italic" fill="#c4623a" font-size="22">&#160;— long context, recursively</tspan></text>

  <rect x="110" y="66" height="1.5" fill="#c4623a" width="0">
    <animate attributeName="width" values="0;58" dur="1s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>

  <text x="110" y="92" font-family="'Segoe UI', -apple-system, Helvetica, sans-serif" font-size="14" fill="#f5f1ea" fill-opacity="0.62">Recursive LMs vs vanilla inference — reproducible benchmarks, 6 GB GPU.</text>
  <text x="110" y="92" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1" fill="#c4623a"><tspan x="700">BLOG&#160;&#160;↗</tspan></text>

